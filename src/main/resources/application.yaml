spring:
  application:
    name: track
  # 데이터베이스 (H2) 연결
  datasource:
    url: jdbc:h2:~/projects/track
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # H2 콘솔
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always