services:
  mysql:
    image: mysql:8.0
    container_name: track-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: track
      MYSQL_USER: track
      MYSQL_PASSWORD: track

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: