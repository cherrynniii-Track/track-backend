name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/cherrynniii-track/track-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$EC2_SSH_KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd /opt/track

            git pull --ff-only origin main
            docker compose pull app
            docker compose up -d --no-build app

            health_check_succeeded=false

            for i in $(seq 1 24); do
              if curl -fsS http://localhost:8080/actuator/health; then
                echo ""
                echo "Health check succeeded"
                health_check_succeeded=true
                break
              fi

              echo "Waiting for application... ($i/24)"
              sleep 5
            done

            if [ "$health_check_succeeded" != "true" ]; then
              echo "Health check failed"
              docker compose logs --tail 100 app
              exit 1
            fi

            echo "Deployment succeeded"
          EOF